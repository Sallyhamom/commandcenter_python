<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>UGV Command Center</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./static/ugv.css">
<style>

</style>
</head>

<body>

<div class="app">

    <!-- TOPBAR -->

    <div class="topbar glass">

        <div class="brand">

            <img
                src="./static/arlogowithrvmt.png"
                class="brandImage"
            />

            <div class="brandContent">

                <div class="brandTitle">
                    UGV CONTROL
                </div>

                <div class="brandSub">
                    Autonomous Ground Vehicle Command Center
                </div>

            </div>

        </div>

        <div class="telemetry">

            <div class="telemetryCard">
                <div class="telemetryLabel">BATTERY</div>
                <div class="telemetryValue green">87%</div>
            </div>

            <div class="telemetryCard">
                <div class="telemetryLabel">GPS</div>
                <div class="telemetryValue">12</div>
            </div>

            <div class="telemetryCard">
                <div class="telemetryLabel">SIGNAL</div>
                <div class="telemetryValue green">STRONG</div>
            </div>

            <div class="telemetryCard">
                <div class="telemetryLabel">MODE</div>
                <div class="telemetryValue blue">MANUAL</div>
            </div>

        </div>

    </div>

    <!-- =====================================================
         MAIN
    ===================================================== -->

    <div class="main">

        <!-- MAP -->

        <div class="mapPanel glass">

            <div class="mapHeader">
                MAP
            </div>

            <div class="mapGrid"></div>

            <!-- IMPORTANT -->
            <canvas id="mapCanvas"></canvas>

        </div>

        <!-- VIDEO -->

        <div class="videoPanel glass">

            <div class="videoOverlay">

                <div class="liveDot"></div>

                <div class="videoLabel">
                    VIDEO
                </div>

            </div>


            <iframe
                id="cameraFeed"
                src="">
            </iframe>

        </div>

    </div>

    <!-- =====================================================
         LIGHT DOCK
    ===================================================== -->

    <div class="lightDock">

        <!-- =====================================================
             ESTOP
        ===================================================== -->

        <button id="estop-button">
            STOP
        </button>

        <!-- FRONT -->

        <div class="lightControl">

            <button
                class="lightCircle front"
                id="frontBtn">

                ☀

            </button>

            <div class="lightState" id="frontState">
                OFF
            </div>

        </div>

        <!-- REAR -->

        <div class="lightControl">

            <button
                class="lightCircle rear"
                id="rearBtn">

                ◉

            </button>

            <div class="lightState" id="rearState">
                OFF
            </div>

        </div>

        <!-- FOG -->

        <div class="lightControl">

            <button
                class="lightCircle fog"
                id="fogBtn">

                ≋

            </button>

            <div class="lightState" id="fogState">
                OFF
            </div>

        </div>

    </div>

    <div class="streamControls">

            <input
                type="text"
                id="ipcInput"
                placeholder="IPC IP Address"
                value=""
            />

            <button id="connectVideoBtn">
                🔗
            </button>

    </div>

    <!-- =====================================================
         CONTROL DRAWER
    ===================================================== -->

    <div id="controlDrawer">

        <!-- TOGGLE -->

        <button id="controlToggle">
            ❯
        </button>

        <!-- =====================================================
             TABS
        ===================================================== -->

        <div class="drawerTabsVertical">

            <button
                class="drawerTabVertical"
                id="favoritesTabBtn">
                ★
            </button>

            <button
                class="drawerTabVertical active"
                id="stationsTabBtn">
                ◎
            </button>

        </div>

        <!-- =====================================================
             STATIONS AREA
        ===================================================== -->

        <div class="drawerStations">

            <!-- FAVORITES VIEW -->

            <div
                id="favoritesView"
                class="drawerView hidden">

                <div class="stationsHeader">

                    <div class="panelTitle">
                        FAVORITES
                    </div>
                    <input
                        type="text"
                        id="favoritesFilter"
                        placeholder="Search"
                    />

                </div>

                <div id="favoritesContainer"></div>

            </div>

            <!-- STATIONS VIEW -->

            <div
                id="stationsView"
                class="drawerView">

                <div class="stationsHeader">

                    <div class="panelTitle">
                        STATIONS
                    </div>

                    <input
                        type="text"
                        id="stationFilter"
                        placeholder="Search"
                    />

                </div>

                <div id="stationsContainer"></div>

            </div>

        </div>

        <!-- =====================================================
             ACTIONS
        ===================================================== -->

        <div class="drawerActions" id="drawerActionId">

            <button
                class="actionBtn add"
                id="saveFavoriteBtn">

                <div class="actionIcon">★</div>
                <div class="actionLabel">Favorite</div>

            </button>

            <button
                class="actionBtn add"
                id="addStationBtn">

                <div class="actionIcon">+</div>
                <div class="actionLabel">ADD</div>

            </button>

            <button
                class="actionBtn start"
                id="startMission">

                <div class="actionIcon">▶</div>
                <div class="actionLabel">START</div>

            </button>

            <button
                class="actionBtn stop"
                id="cancelMission">

                <div class="actionIcon">■</div>
                <div class="actionLabel">STOP</div>

            </button>

            <button
                class="actionBtn clear"
                id="clearMission">

                <div class="actionIcon">✕</div>
                <div class="actionLabel">CLEAR</div>

            </button>

        </div>

        <!-- =====================================================
             DRIVE CONTROL
        ===================================================== -->

        <div class="drawerDrive">

            <div class="panelTitle center">
                DRIVE CONTROL
            </div>

            <div
                class="joystick"
                id="joystick-base">

                <div
                    class="knob"
                    id="joystick-knob">

                </div>

            </div>

        </div>

    </div>

    <!-- =====================================================
         STATUS
    ===================================================== -->

    <div id="jobStatus" style="display:none;">
        Status: Idle
    </div>

    <!-- =====================================================
         TOASTS
    ===================================================== -->

    <div id="notifContainer"></div>

    <!-- =====================================================
         STATION DIALOG
    ===================================================== -->

    <div id="stationDialog" class="dialogOverlay hidden">

        <div class="dialogBox">

            <div class="dialogTitle">
                Add Station
            </div>

            <div class="dialogMessage">
                Enter station name
            </div>

            <input
                type="text"
                id="stationNameInput"
                class="dialogInput"
                placeholder="Station name"
            />

            <div class="dialogActions">

                <button id="stationCancelBtn"
                        class="dialogBtn secondary">
                    Cancel
                </button>

                <button id="stationSaveBtn"
                        class="dialogBtn primary">
                    Save
                </button>

            </div>

        </div>

    </div>

    <!-- =====================================================
         Favorite DIALOG
    ===================================================== -->

    <div id="favDialog" class="dialogOverlay hidden">

        <div class="dialogBox">

            <div class="dialogTitle">
                Add Favorite
            </div>

            <div class="dialogMessage">
                Enter Favorite name
            </div>

            <input
                type="text"
                id="favNameInput"
                class="dialogInput"
                placeholder="Favorite name"
            />

            <div class="dialogActions">

                <button id="favCancelBtn"
                        class="dialogBtn secondary">
                    Cancel
                </button>

                <button id="favSaveBtn"
                        class="dialogBtn primary">
                    Save
                </button>

            </div>

        </div>

    </div>

</div>

<script type="text/javascript" src="./static/libs/ugvjs.js"></script>
</body>
</html>
